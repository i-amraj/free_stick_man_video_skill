<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Realistic 3D Human Pose & Anatomy Test</title>
  <script src="lib/three.min.js"></script>
  <script src="lib/meshopt_decoder.js"></script>
  <script src="lib/GLTFLoader.js"></script>
  <script src="lib/gsap.min.js"></script>
  <style>
    body { margin: 0; background: #080d1a; overflow: hidden; }
    canvas { width: 1080px; height: 1920px; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x060913);

  const camera = new THREE.PerspectiveCamera(40, 1080 / 1920, 0.1, 50);
  camera.position.set(0, 1.45, 3.2);
  camera.lookAt(0, 1.3, 0);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(1080, 1920);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  // Cinematic Mystery Noir Lighting
  const moonLight = new THREE.DirectionalLight(0x38bdf8, 2.8);
  moonLight.position.set(2.5, 5, 3.5);
  moonLight.castShadow = true;
  moonLight.shadow.mapSize.width = 2048;
  moonLight.shadow.mapSize.height = 2048;
  scene.add(moonLight);

  const warmRimLight = new THREE.DirectionalLight(0xf59e0b, 1.8);
  warmRimLight.position.set(-3, 3, -2.5);
  scene.add(warmRimLight);

  const cyanFill = new THREE.PointLight(0x0284c7, 1.5, 8);
  cyanFill.position.set(0, 2.5, 2.0);
  scene.add(cyanFill);

  scene.add(new THREE.AmbientLight(0x0c162d, 1.2));

  // Floor
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(12, 12),
    new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.35, metalness: 0.2 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // Phone Mesh to attach to hand
  const phone = new THREE.Mesh(
    new THREE.BoxGeometry(0.08, 0.16, 0.012),
    new THREE.MeshStandardMaterial({ color: 0x020617, roughness: 0.2, metalness: 0.85 })
  );
  // Phone screen glow
  const phoneScreen = new THREE.Mesh(
    new THREE.PlaneGeometry(0.075, 0.15),
    new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
  );
  phoneScreen.position.z = 0.007;
  phone.add(phoneScreen);

  const loader = new THREE.GLTFLoader();
  loader.setMeshoptDecoder(MeshoptDecoder);

  window.bones = {};
  window.humanModel = null;

  loader.load('models/real_human_male.glb', (gltf) => {
    const model = gltf.scene;
    window.humanModel = model;

    // Scale to realistic 1.78m height
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const scaleFactor = 1.78 / size.y;
    model.scale.set(scaleFactor, scaleFactor, scaleFactor);

    // Ground on floor
    const newBox = new THREE.Box3().setFromObject(model);
    model.position.y = -newBox.min.y;

    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
        if (child.material) {
          child.material.roughness = 0.55;
          child.material.metalness = 0.1;
          child.material.needsUpdate = true;
        }
      }
      if (child.isBone) {
        window.bones[child.name] = child;
      }
    });

    scene.add(model);
    console.log("Found bones:", Object.keys(window.bones).length);

    // Natural Relaxed Pose (bringing arms down from T-pose)
    const b = window.bones;
    if (b.RightArm && b.LeftArm) {
      // Natural arm drop
      b.RightArm.rotation.z = -1.25;
      b.RightArm.rotation.x = 0.2;
      b.LeftArm.rotation.z = 1.25;
      b.LeftArm.rotation.x = 0.2;

      // Forearms slight natural bend
      if (b.RightForeArm) b.RightForeArm.rotation.z = -0.25;
      if (b.LeftForeArm) b.LeftForeArm.rotation.z = 0.25;

      // Spine & head slight natural slouch
      if (b.Spine) b.Spine.rotation.x = 0.08;
      if (b.Head) b.Head.rotation.x = -0.05;

      // Relax fingers
      const fingerBones = [
        'RightHandThumb1', 'RightHandIndex1', 'RightHandMiddle1', 'RightHandRing1', 'RightHandPinky1',
        'LeftHandThumb1', 'LeftHandIndex1', 'LeftHandMiddle1', 'LeftHandRing1', 'LeftHandPinky1'
      ];
      fingerBones.forEach(fName => {
        if (b[fName]) b[fName].rotation.x = 0.35;
      });
    }

    // Attach phone to Right Hand
    if (b.RightHand) {
      phone.position.set(0.04, 0.08, 0.02);
      phone.rotation.set(0, 0, 0);
      b.RightHand.add(phone);
    }

    // Now test phone-to-ear pose
    // For phone call pose:
    b.RightArm.rotation.x = 0.4;
    b.RightArm.rotation.y = -0.5;
    b.RightArm.rotation.z = -2.1;
    if (b.RightForeArm) {
      b.RightForeArm.rotation.z = -1.6;
      b.RightForeArm.rotation.y = 0.8;
    }
    if (b.Head) {
      b.Head.rotation.z = -0.15; // head tilts to phone
      b.Head.rotation.y = 0.15;
    }

    window.poseReady = true;
    console.log("Pose ready!");
  });

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
